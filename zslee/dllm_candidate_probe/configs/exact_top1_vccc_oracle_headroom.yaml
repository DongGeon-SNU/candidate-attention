# Experiment 3: exact all-order VCCC oracle checking.
#
# The source run supplies a deterministic primary prompt cohort and model
# provenance. Every policy below is freshly rolled out from the same t=0
# generated-mask seed; archived .9 actions are never used as the .8 baseline.
model:
  name: GSAI-ML/LLaDA-8B-Instruct
  fast_dllm_repo: https://github.com/NVlabs/Fast-dLLM.git
  fast_dllm_commit: a9b81e4caa240c8cad4f7dc1889ff4852a0fca5b
  hf_revision: main
  dtype: auto

decoding:
  # Required by the shared frozen-model loader. No stochastic sampling is
  # used after the source t=0 seed is selected.
  seed: 20260902
  generation_length: 16
  max_steps: 16

source:
  required_primary_threshold: 0.9
  required_decoder_policy: confidence_ge_threshold_plus_argmax_fallback
  # These reproduce the former headroom audit's outcome-blind prompt cohort,
  # then the new experiment replays each selected prompt from its t=0 state.
  state_selection_salt: headroom-primary-state
  prompt_selection_salt: headroom-primary-prompt
  primary_prompt_cap: 100

fast_dllm_baseline:
  threshold: 0.8
  fallback_rule: force_first_highest_confidence_position_when_none_reach_threshold
  # Native measures the historical collector-style Fast-dLLM call. The
  # no-cache matched replay exists only for a controlled output comparison.
  native_throughput_cache_policy: use_cache_true_without_past_key_values_reuse
  matched_agreement_cache_policy: use_cache_false

exact_vccc_oracle:
  candidate_sizes: [2, 4, 8]
  candidate_rank: probability_p1_minus_p2_descending_then_physical_position
  # The top-K pool is searched exhaustively. The action is the largest
  # all-order-safe subset, with summed p1-p2 then physical-position ties.
  selected_set_rule: max_cardinality_then_sum_probability_margin_then_physical_position
  margin_threshold: 0.0
  tie_tolerance: 1.0e-7

execution:
  # Exact VCCC and its matched Fast control use fixed-position no-cache
  # forwards. Native Fast-dLLM throughput is reported separately above.
  exact_measurement_cache_policy: use_cache_false
  subset_batch_size: 8
  random_seed_namespace: exact-top1-vccc-oracle-checking-v1

reporting:
  clustered_bootstrap_replicates: 10000
  bootstrap_seed: 20260911

storage:
  output_root: outputs/vccc_oracle_audit
  run_prefix: exact_top1_vccc_oracle_headroom_
